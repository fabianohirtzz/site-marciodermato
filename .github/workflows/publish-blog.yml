name: Publicar blog

on:
  repository_dispatch:
    types: [publish-blog]
  workflow_dispatch: {}
  # A cada 30 min, só para ver se algum post agendado venceu. Quando não há
  # nada vencido, o job `gate` termina em segundos e o `build` nem começa.
  schedule:
    - cron: '0,30 * * * *'

permissions:
  contents: write

concurrency:
  group: publish-blog
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Promover posts agendados vencidos
        id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          EVENTO: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # Publicação manual (botão "Atualizar site" ou disparo manual):
          # constrói direto, sem nem tocar no banco.
          if [ "$EVENTO" != "schedule" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Evento $EVENTO — build direto."
            exit 0
          fi

          # Falhar alto: um agendamento que não vai ao ar por secret ausente
          # precisa aparecer como erro vermelho, não como execução verde.
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_KEY:-}" ]; then
            echo "::error::Secrets SUPABASE_URL/SUPABASE_SERVICE_KEY ausentes — agendamentos nao seriam publicados."
            exit 1
          fi

          # Um único carimbo de tempo serve para consultar e para promover,
          # senão um post poderia vencer entre as duas chamadas e escapar.
          agora=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          filtro="status=eq.scheduled&date=lte.$agora"

          vencidos=$(curl -sS --fail-with-body \
            "$SUPABASE_URL/rest/v1/mt_posts?$filtro&select=id,slug" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY")

          if [ "$vencidos" = "[]" ]; then
            # Nada vencido agora nao significa que o site esta em dia: um build
            # anterior pode ter falhado depois da promocao. So desiste se o
            # flag de pendencia tambem estiver limpo.
            pendencia=$(curl -sS --fail-with-body \
              "$SUPABASE_URL/rest/v1/mt_site_meta?id=eq.1&select=pending_build" \
              -H "apikey: $SUPABASE_SERVICE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_KEY")

            if echo "$pendencia" | grep -q '"pending_build":true'; then
              echo "build=true" >> "$GITHUB_OUTPUT"
              echo "Nenhum post novo venceu, mas ha um build pendente de retentativa."
              exit 0
            fi

            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Nenhum post agendado venceu ate $agora."
            exit 0
          fi

          echo "Promovendo: $vencidos"
          curl -sS --fail-with-body -X PATCH \
            "$SUPABASE_URL/rest/v1/mt_posts?$filtro" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"status":"published"}'

          # Marca a pendencia antes do build rodar: se ele falhar, o proximo
          # slot do gate ainda sabe que precisa tentar de novo.
          curl -sS --fail-with-body -X PATCH \
            "$SUPABASE_URL/rest/v1/mt_site_meta?id=eq.1" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"pending_build":true}'

          echo "build=true" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Sem as credenciais do Supabase, build-blog.mjs cai no seed.json de
      # exemplo — e o deploy FTP publicaria posts placeholder no site real.
      # Falhar aqui é sempre melhor do que publicar lixo.
      - name: Conferir credenciais antes de publicar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          faltando=""
          for v in SUPABASE_URL SUPABASE_SERVICE_KEY FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_SERVER_DIR; do
            [ -z "${!v}" ] && faltando="$faltando $v"
          done
          if [ -n "$faltando" ]; then
            echo "::error::Secrets faltando:$faltando"
            exit 1
          fi
          echo "Todos os secrets presentes."

      - name: Build do blog lendo do Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node tools/build-blog.mjs

      - name: Regerar sitemap com os posts novos
        run: node tools/build-sitemap.mjs

      - name: Commit do HTML gerado
        run: |
          git config user.name "Marcio Dermato Bot"
          git config user.email "bot@marciodermato.com.br"
          git add -A
          git diff --cached --quiet || git commit -m "chore(blog): rebuild automatico do site [skip ci]"
          git push

      # O site mora na Erehost, não no GitHub Pages. Sem este passo o HTML
      # gerado acima fica só no repositório e nunca chega no ar.
      - name: Deploy para a Erehost via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          # Pure-FTPd da Erehost com Let's Encrypt para cpbr-sp2.erehost.com.br.
          # Conectar pelo hostname (e não pelo IP) faz o certificado validar,
          # então dá para exigir TLS estrito em vez de afrouxar a verificação.
          protocol: ftps
          security: strict
          timeout: 60000
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.claude/**
            docs/**
            tools/**
            scripts/**
            supabase/**
            fotos/**
            ambiente/**
            antes-depois/**
            preview-*.html
            README.md
            COPY-TRATAMENTOS.md
            SITE 2025.docx
            package.json
            package-lock.json
            **/*.wpress

      - name: Marcar site como publicado
        if: success()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          curl -sS -X PATCH "$SUPABASE_URL/rest/v1/mt_site_meta?id=eq.1" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"dirty\":false,\"publishing\":false,\"pending_build\":false,\"last_published_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"

      - name: Liberar flag de publicação (mesmo se falhar)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          curl -sS -X PATCH "$SUPABASE_URL/rest/v1/mt_site_meta?id=eq.1" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"publishing\":false}"
